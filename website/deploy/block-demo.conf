# OFFPEAK static hosting: the local console demo is not shipped.
# Include inside the nginx `server { ... }` block for offpeakai.app.
# Returns 404 for /app, /app/..., /console, /console/... (and lookalikes such as /apps, /console.html).

location ~* ^/(app|console)([/.?].*|s?)?$ {
    return 404;
}

# Optional: canonical host
# server { listen 443 ssl; server_name www.offpeakai.app; return 301 https://offpeakai.app$request_uri; }
