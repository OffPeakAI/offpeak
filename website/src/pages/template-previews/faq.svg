<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Illustrative faq drafting workflow"><defs><filter id="paper" x="-15%" y="-15%" width="140%" height="145%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#050805" flood-opacity=".22"/></filter><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#CCFF00" stroke-width="1.4" stroke-opacity=".44"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#849372" fill-opacity=".2"/></pattern><linearGradient id="workflow-metal" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#646b60"/><stop offset=".47" stop-color="#41473b"/><stop offset="1" stop-color="#2c3228"/></linearGradient><linearGradient id="workflow-recess" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#474e42"/><stop offset=".48" stop-color="#333b2e"/><stop offset="1" stop-color="#262e21"/></linearGradient></defs><rect width="1600" height="1000" fill="#303532"/><rect width="1600" height="1000" fill="url(#grid)" opacity=".5"/><g font-family="Manrope,Arial,sans-serif"><circle cx="64" cy="63" r="6" fill="#CCFF00"/><text x="86" y="70" font-size="18" fill="#aab89a" font-weight="600">OFFPEAK / FAQ DRAFTING</text><text x="1325" y="70" font-size="18" fill="#aab89a" font-weight="600">EXAMPLE FLOW</text><g transform="rotate(-3 422.5 300.0)"><rect x="145" y="165" width="555" height="270" rx="15" fill="url(#workflow-metal)" stroke="#7b856a" filter="url(#paper)"/><text x="175" y="222" font-size="31" fill="#e8eddf" font-weight="500">What does the source say?</text><text x="175" y="257" font-size="18" fill="#aab89a" font-weight="600">QUESTION 01</text><circle cx="181" cy="300" r="4" fill="#CCFF00"/><text x="199" y="308" font-size="22" fill="#e8eddf" font-weight="400">Draft a grounded answer.</text><circle cx="181" cy="346" r="4" fill="#CCFF00"/><text x="199" y="354" font-size="22" fill="#e8eddf" font-weight="400">Keep the supporting reference.</text></g><g transform="rotate(2 1122.5 372.5)"><rect x="825" y="225" width="595" height="295" rx="15" fill="url(#workflow-metal)" stroke="#7b856a" filter="url(#paper)"/><text x="855" y="282" font-size="31" fill="#e8eddf" font-weight="500">What remains unknown?</text><text x="855" y="317" font-size="18" fill="#aab89a" font-weight="600">QUESTION 02</text><circle cx="861" cy="360" r="4" fill="#CCFF00"/><text x="879" y="368" font-size="22" fill="#e8eddf" font-weight="400">Do not invent an answer.</text><circle cx="861" cy="406" r="4" fill="#CCFF00"/><text x="879" y="414" font-size="22" fill="#e8eddf" font-weight="400">Send uncertain items for review.</text></g><g transform="rotate(-1 642.5 720.0)"><rect x="315" y="590" width="655" height="260" rx="15" fill="url(#workflow-metal)" stroke="#7b856a" filter="url(#paper)"/><text x="345" y="647" font-size="31" fill="#e8eddf" font-weight="500">What should be checked?</text><text x="345" y="682" font-size="18" fill="#aab89a" font-weight="600">QUESTION 03</text><circle cx="351" cy="725" r="4" fill="#CCFF00"/><text x="369" y="733" font-size="22" fill="#e8eddf" font-weight="400">Read each answer against its source.</text><circle cx="351" cy="771" r="4" fill="#CCFF00"/><text x="369" y="779" font-size="22" fill="#e8eddf" font-weight="400">Approve the wording before use.</text></g><rect x="1102" y="659" width="90" height="44" rx="22" fill="#30382a" stroke="#7b856a"/><text x="1119" y="688" font-size="20" fill="#e8eddf" font-weight="400">Draft</text><rect x="1140" y="730" width="108" height="44" rx="22" fill="#30382a" stroke="#7b856a"/><text x="1157" y="759" font-size="20" fill="#e8eddf" font-weight="400">Review</text><text x="60" y="952" font-size="18" fill="#aab89a" font-weight="600">OPEN-MODEL TEXT · CAPPED REQUEST · HUMAN REVIEW</text><text x="1365" y="952" font-size="18" fill="#aab89a" font-weight="400">09 / 18</text></g></svg>
