[profile.default]
src = "src"
out = "out"
libs = ["lib"]
allow_paths = ["../node_modules"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20000
# Foundry's defaults, written out so a new Foundry release cannot change the bytecode.
bytecode_hash = "ipfs"
cbor_metadata = true
# Stubs keep named parameters so the ABIs are final. Drop 5667 and 2018 once A2-A9 replace them.
ignored_error_codes = [5667, 2018]
fs_permissions = [
  { access = "read", path = "../packages/shared/fixtures" },
  { access = "read", path = "test/fixtures" },
  { access = "read", path = "config" },
  { access = "read", path = "out" },
  { access = "read-write", path = "../packages/abis/deployments" },
]
remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# WindowMarket passes the 24 KB limit only at this setting. Every other contract keeps the default.
additional_compiler_profiles = [{ name = "compact", optimizer_runs = 200 }]
compilation_restrictions = [{ paths = "src/WindowMarket.sol", optimizer_runs = 200 }]

[lint]
lint_on_build = false

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 128
fail_on_revert = true

[profile.audit.fuzz]
runs = 1024

[profile.audit.invariant]
runs = 1024
depth = 128
fail_on_revert = true
